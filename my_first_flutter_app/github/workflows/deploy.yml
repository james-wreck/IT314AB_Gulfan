
name: Deploy Flutter Web to AWS Lightsail

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: my_first_flutter_app
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: my_first_flutter_app
        run: flutter build web --release

      - name: Prepare SSH connection
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Prepare server directory
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USERNAME@$LIGHTSAIL_HOST" \
            "sudo mkdir -p /var/www/flutter_app &&
             sudo chown -R $LIGHTSAIL_USERNAME:$LIGHTSAIL_USERNAME /var/www/flutter_app"

      - name: Upload Flutter Web files
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/lightsail_key" \
            my_first_flutter_app/build/web/ \
            "$LIGHTSAIL_USERNAME@$LIGHTSAIL_HOST:/var/www/flutter_app/"

      - name: Reload Nginx
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          ssh -i ~/.ssh/lightsail_key \
            "$LIGHTSAIL_USERNAME@$LIGHTSAIL_HOST" \
            "sudo chown -R www-data:www-data /var/www/flutter_app &&
             sudo nginx -t &&
             sudo systemctl reload nginx"
